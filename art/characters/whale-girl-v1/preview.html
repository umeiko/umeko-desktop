<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鲸鱼娘 · 主角色美术与台词验收</title>
<style>
:root{font:16px/1.7 system-ui,sans-serif;background:#f5f7fa;color:#273746}body{max-width:1020px;margin:40px auto;padding:0 24px 60px}header{border-bottom:1px solid #dce3ea;padding-bottom:22px}h1{font-size:30px;margin:12px 0 6px}h2{font-size:21px;margin:30px 0 14px}h3{font-size:16px;margin:0 0 12px;color:#627487;font-weight:500}p{margin:8px 0;color:#627487}a{color:#3d6d9a;text-underline-offset:4px}nav{display:flex;gap:24px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.line{border:1px solid #dce3ea;background:#fff;border-radius:12px;padding:16px 18px}.single{margin:14px 0}.group{margin:20px 0 28px}.count{font-size:14px;color:#8592a0;margin-left:8px}footer{margin-top:36px;color:#8592a0;font-size:14px}@media(max-width:680px){.grid{grid-template-columns:1fr}body{margin-top:22px}h1{font-size:25px}}
</style>
<header>
<nav><a href="../tiara-v2/preview.html#rare">角色美术预览</a><a href="dialogue.json" download="whale-girl-dialogue.json">下载台词 JSON</a></nav>
<h1>鲸鱼娘 · 主角色美术与台词</h1>
<p>称呼是“人”。念头是“米”。短句，略生硬，有点理直气壮。</p>
</header>
<style>
.art-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.art-card{text-align:center;background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:14px}.art-card img{width:100%;height:220px;object-fit:contain}.small-avatars{display:flex;justify-content:center;align-items:center;gap:20px;margin:20px 0}.small-avatars img{object-fit:contain}button{font:inherit;border:1px solid #bac8d8;border-radius:9px;background:transparent;color:inherit;padding:7px 13px;cursor:pointer}body.dark{background:#1b2534;color:#e4ecf8}body.dark p,body.dark h3,body.dark footer{color:#a5b7cb}body.dark .line,body.dark .art-card{background:#263446;border-color:#41556d}html:has(body.dark){background:#1b2534}@media(max-width:680px){.art-grid{grid-template-columns:1fr 1fr}.art-card img{height:170px}}
</style>
<section>
<h2>主角色 · 九种场景</h2>
<button onclick="document.body.classList.toggle('dark')">切换明暗背景</button>
<div class="art-grid" id="art"></div>
<h3>小尺寸头像 · 24 / 40 / 64 / 96 px</h3><div class="small-avatars" id="avatar-sizes"></div>
</section>
<main id="dialogue"></main>
<section><h2>稀有彩蛋 · 沿用原句</h2><div class="line">人，你给我吃米，人，日后我会放你一马的</div></section>
<footer>本地验收稿。主角色素材与桌宠动画分开，台词使用现有角色包格式。</footer>
<script>
const artBase='../../../app/icons/characters/whale-girl/';
for(const [id,label] of [['welcome','主页 · 讨米'],['avatarSmile','日常头像'],['avatarWink','眨眼头像'],['avatarHappy','开心头像'],['reply','回复完成'],['loading','加载思考'],['catch','接住文件'],['push','推开侧栏'],['pull','拉回侧栏']]){
 const card=document.createElement('div'),img=new Image(),text=document.createElement('div');card.className='art-card';img.src=artBase+id+'.png';img.alt=label;text.textContent=label;card.append(img,text);document.querySelector('#art').append(card);
}
for(const size of [24,40,64,96]){const image=new Image();image.src=artBase+'avatarSmile.png';image.width=size;image.height=size;image.alt=size+'px 日常头像';document.querySelector('#avatar-sizes').append(image)}
const sections=[
 ['欢迎页', [['welcome','greetings','随机问候'],['welcome','tap','点击人物'],['welcome','celebration','连续点击 / 长按彩蛋'],['welcome','dragReturn','拖动回弹']]],
 ['回复结束', [['reply','tap','点击人物'],['reply','celebration','连续点击彩蛋']]],
 ['侧栏与文件', [['layout','tooNarrow','达到最小宽度'],['layout','expandLeft','展开左侧'],['layout','collapseLeft','收起左侧'],['layout','expandRight','展开右侧'],['layout','collapseRight','收起右侧'],['files','drop','拖入文件']]],
 ['加载会话', [['loading','title','加载文字'],['loading','tips','随机使用提示']]]
];
fetch('dialogue.json', {cache:'no-store'}).then(r=>{if(!r.ok)throw Error('无法读取台词');return r.json()}).then(value=>{
 for(const [name,groups] of sections){
  const section=document.createElement('section'),h=document.createElement('h2');h.textContent=name;section.append(h);
  for(const [scene,key,label] of groups){
   const group=document.createElement('div');group.className='group';
   const title=document.createElement('h3'),lines=Array.isArray(value.scenes[scene][key])?value.scenes[scene][key]:[value.scenes[scene][key]];
   title.textContent=label;const count=document.createElement('span');count.className='count';count.textContent=lines.length+' 条';title.append(count);group.append(title);
   const grid=document.createElement('div');grid.className=lines.length>1?'grid':'single';
   for(const line of lines){const card=document.createElement('div');card.className='line';card.textContent=line;grid.append(card)}
   group.append(grid);section.append(group);
  }
  document.querySelector('#dialogue').append(section);
 }
}).catch(e=>{document.querySelector('#dialogue').textContent=e.message});
</script>
</html>
