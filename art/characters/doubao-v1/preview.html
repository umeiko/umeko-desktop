<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>豆包 · Umeko 角色素材</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;color:#273141;background:#fff}*{box-sizing:border-box}body{margin:0;padding:32px;max-width:1400px;margin-inline:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}h1{margin:0;font-size:30px}p{color:#728096}button{background:#f4f6fa;border:1px solid #dfe5ed;border-radius:10px;padding:10px 16px;cursor:pointer;color:inherit}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}figure{margin:0;border:1px solid #e3e7ef;border-radius:16px;overflow:hidden}img{display:block;width:100%;aspect-ratio:1;object-fit:contain;padding:12px}figcaption{padding:13px 18px;border-top:1px solid #e3e7ef;font-size:14px}.dark{background:#171b24;color:#e9edf5}.dark figure{border-color:#373f50}.dark figcaption{border-color:#373f50}.dark button{background:#252c39;border-color:#373f50}@media(max-width:680px){body{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<header><div><h1>豆包</h1><p>Umeko · 主角色与子智能体</p></div><button onclick="document.body.classList.toggle('dark')">切换明暗背景</button></header>
<main class="grid" id="art"></main>
<h2>主页彩蛋</h2><div class="grid"><figure><img src="../../../app/icons/characters/rare-scenes/doubao.png" alt="主页彩蛋"><figcaption>我就在这里，不躲、不藏、不绕、不逃，稳稳地接住你。</figcaption></figure></div>
<h2>桌面小宠物 · 二维 Q 版</h2><div class="grid" id="pets"></div>
<script>
const labels={picker:'选择框与聊天头像',reply:'回复结尾',welcome:'欢迎',loading:'加载',catch:'接文件',push:'向外推',pull:'向内拉'};
for(const [slot,label] of Object.entries(labels)){
 const figure=document.createElement('figure'),image=document.createElement('img'),caption=document.createElement('figcaption');
 const file=['avatarSmile','avatarWink','avatarHappy'].includes(slot)?'picker':slot;
 image.src='../../../app/icons/characters/doubao/'+file+'.png';image.alt=label;caption.textContent=label;
 figure.append(image,caption);document.querySelector('#art').append(figure);
}
for(const [state,label] of Object.entries({idle:'待机',thinking:'思考',working:'工作',waiting:'等待',done:'完成',error:'出错','idle-rare':'稀有待机'})){
 const figure=document.createElement('figure'),image=document.createElement('img'),caption=document.createElement('figcaption');
 image.src='../../../umeko-plugins/desktop-pet/assets/doubao/'+state+'.webp';image.alt=label;caption.textContent=label;
 figure.append(image,caption);document.querySelector('#pets').append(figure);
}
</script>
</html>
