name: Publish verified desktop release
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Main build with passed shared tests and selected native jobs
        required: true
        type: string
      tag:
        description: Version tag matching the selected build manifests
        default: v0.7.1
        required: true
        type: string
      platforms:
        description: Publish all four platforms or the verified Windows package first
        type: choice
        options: [all, windows]
        default: all
      replace_existing:
        description: Explicitly overwrite the existing same-version assets and retarget its tag
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-releases
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_PLATFORM_MODE: ${{ inputs.platforms }}
      REPLACE_EXISTING_RELEASE: ${{ inputs.replace_existing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify trusted build, upload assets and publish
        run: python3 scripts/publish-release.py
