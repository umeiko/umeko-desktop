name: Real remote network sharing

on:
  pull_request:
    paths:
      - 'app/remote*.py'
      - 'app/controller*.py'
      - 'runtime/remote*.mjs'
      - 'runtime/bridge.mjs'
      - 'runtime/umeko-operations.json'
      - 'tests/remote_network_real.py'
      - 'tests/fixtures/remote_ssh_shim.py'
      - '.github/workflows/remote-network.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: umeko-remote-network-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-real-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install Qt, real SSH, and small download tools
        run: bash scripts/ci-linux-libraries.bash openssh-server python3-pip npm iptables gnome-keyring dbus-x11 libegl1 libopengl0 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 libxcb-render-util0 libxcb-randr0 libxcb-xfixes0 libnss3 libasound2t64
      - name: Prepare the real Pi runtime
        run: bash setup.sh
      - name: Check proxy settings and forwarding
        run: node --test runtime/test-remote-network.mjs
      - name: Fetch official Linux exec-server
        run: .venv/bin/python scripts/fetch-remote-exec.py --platform linux --arch x64 --output runtime/releases/coding-1.5.2/remote-exec-assets
      - name: Exercise real downloads with direct egress blocked only for the fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/network-sshd"
          test_user=umeko_net_ci
          chain=UMEKO_NET_CI
          mkdir -p "$fixture" "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          sudo useradd --create-home --shell /bin/bash "$test_user"
          # Password authentication remains disabled; unlock only this ephemeral account.
          sudo passwd -d "$test_user"
          sudo chmod 755 "$RUNNER_TEMP"
          chmod 755 "$fixture"
          ssh-keygen -q -t ed25519 -N '' -f "$fixture/host_key"
          ssh-keygen -q -t ed25519 -N '' -f "$fixture/client_key"
          cp "$fixture/client_key.pub" "$fixture/authorized_keys"
          chmod 644 "$fixture/authorized_keys"
          cat > "$fixture/sshd_config" <<EOF
          Port 22223
          ListenAddress 127.0.0.1
          HostKey $fixture/host_key
          PidFile $fixture/sshd.pid
          AuthorizedKeysFile $fixture/authorized_keys
          StrictModes no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          UsePAM yes
          PermitRootLogin no
          AllowUsers $test_user
          Subsystem sftp internal-sftp
          EOF
          # Only this disposable user receives sudo; no production server is changed.
          printf '%s ALL=(root) NOPASSWD: /usr/bin/apt-get, /usr/bin/mkdir, /usr/bin/chmod\n' "$test_user" | sudo tee /etc/sudoers.d/umeko-network-ci >/dev/null
          sudo chmod 440 /etc/sudoers.d/umeko-network-ci
          sudo mkdir -p /run/sshd
          touch "$fixture/sshd.log"
          sudo /usr/sbin/sshd -f "$fixture/sshd_config" -E "$fixture/sshd.log"
          cat >> "$HOME/.ssh/config" <<EOF
          Host umeko-network-ci
            HostName 127.0.0.1
            Port 22223
            User $test_user
            IdentityFile $fixture/client_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $fixture/known_hosts
          EOF
          printf '[127.0.0.1]:22223 %s\n' "$(cut -d ' ' -f 1,2 "$fixture/host_key.pub")" > "$fixture/known_hosts"
          cleanup() {
            sudo iptables -D OUTPUT -j "$chain" 2>/dev/null || true
            sudo ip6tables -D OUTPUT -j "$chain" 2>/dev/null || true
            sudo iptables -F "$chain" 2>/dev/null || true
            sudo ip6tables -F "$chain" 2>/dev/null || true
            sudo iptables -X "$chain" 2>/dev/null || true
            sudo ip6tables -X "$chain" 2>/dev/null || true
            if [ -f "$fixture/sshd.pid" ]; then sudo kill "$(cat "$fixture/sshd.pid")" || true; fi
            sudo rm -f /etc/sudoers.d/umeko-network-ci
          }
          trap cleanup EXIT
          # _apt is the actual download worker for sudo apt-get. Loopback stays
          # available for the SSH reverse forward. The app's runner UID remains
          # unrestricted, so its built-in outbound connection really works.
          for family in iptables ip6tables; do
            sudo "$family" -N "$chain"
            sudo "$family" -A "$chain" -o lo -j RETURN
            for uid in "$(id -u "$test_user")" "$(id -u _apt)"; do
              sudo "$family" -A "$chain" -m owner --uid-owner "$uid" -j REJECT
            done
            sudo "$family" -I OUTPUT 1 -j "$chain"
          done
          if dpkg-query -W -f='${Status}' sl 2>/dev/null | grep -q 'install ok installed'; then
            echo 'sl is already installed; choose an absent download target' >&2
            exit 1
          fi
          dbus-run-session -- bash -ec '
            printf "ci-ephemeral-password" | gnome-keyring-daemon --unlock --components=secrets
            .venv/bin/python tests/remote_network_real.py --source --host umeko-network-ci --platform linux --run-dir "$RUNNER_TEMP/network-real" --remote-root /tmp/umeko-network-ci --remote-python /usr/bin/python3
          '
      - name: Upload bounded network evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-network-linux-evidence
          path: |
            ${{ runner.temp }}/network-real/result.json
            ${{ runner.temp }}/network-real/spec.json
            ${{ runner.temp }}/network-real/events.jsonl
            ${{ runner.temp }}/network-real/chat-tool-rows.json
            ${{ runner.temp }}/network-real/application*.log
            ${{ runner.temp }}/network-real/ssh-control/clients.jsonl
            ${{ runner.temp }}/network-real/ssh-control/lifecycle.jsonl
            ${{ runner.temp }}/network-sshd/sshd.log
          if-no-files-found: warn
          retention-days: 7
