name: Desktop packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            platform: windows-x64
          - name: Linux x64
            runner: ubuntu-22.04
            platform: linux-x64
          - name: macOS Apple Silicon
            runner: macos-15
            platform: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            platform: macos-x64
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 libxcb-render-util0 libxcb-randr0 libxcb-xfixes0 libnss3 libasound2

      - name: Set up Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./setup.ps1

      - name: Set up Unix
        if: runner.os != 'Windows'
        run: bash setup.sh

      - name: Windows regression suite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & '.venv/Scripts/python.exe' -m unittest discover -s tests -p 'test_*.py' -q
          if ($LASTEXITCODE -ne 0) { throw 'Regression suite failed' }

      - name: Provider ZIP drag-and-drop interaction
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & '.venv/Scripts/python.exe' scripts/build-provider-resources.py
          if ($LASTEXITCODE -ne 0) { throw 'Provider resource build failed' }
          & '.venv/Scripts/python.exe' tests/provider_plugins_ui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Provider import interaction failed' }

      - name: Chat media, queue and selection interaction
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($test in @('chatbox_ui_smoke.py', 'selection_click_ui_smoke.py', 'chat_interaction_smoke.py', 'ui_smoke.py')) {
            & '.venv/Scripts/python.exe' "tests/$test"
            if ($LASTEXITCODE -ne 0) { throw "Interaction failed: $test" }
          }

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1

      - name: Build Unix
        if: runner.os != 'Windows'
        run: bash build.sh

      - name: Verify packaged application and Pi
        run: python scripts/ci-smoke.py

      - name: Archive package
        run: python scripts/package-release.py --platform ${{ matrix.platform }}

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Umeko-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Provider development resources
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Umeko-provider-development
          path: build/provider-resources/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            build/ci-smoke/*.log
            build/ci-smoke/*.png
            build/ci-smoke/*.json
            build/Umeko/warn-Umeko.txt
            artifacts/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
