name: Desktop packages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-22.04
    # Include dependency setup, cache misses and post-job cleanup in the budget.
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11 extra-cmake-modules libgl1-mesa-dev libxkbcommon-dev libxcb1-dev libx11-dev libegl1 libopengl0 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 libxcb-render-util0 libxcb-randr0 libxcb-xfixes0 libnss3 libasound2

      - name: Set up Linux
        run: bash setup.sh

      - name: Node tests
        run: node --test tests/extension-metadata.test.mjs tests/update-engine.test.mjs tests/update-download.test.mjs tests/update-network.test.mjs tests/webview.test.mjs tests/pi-commands.test.mjs tests/pi-commands-integration.test.mjs tests/umeko-control.test.mjs tests/umeko-documents.test.mjs tests/widget-messages.test.mjs tests/subagents.test.mjs tests/subagent-ui.test.mjs tests/subagent-queue.test.mjs tests/rpc-ui.test.mjs tests/marketplace.test.mjs tests/marketplace-source.test.mjs tests/marketplace-audit-summary.test.mjs tests/marketplace-npm-resolution.test.mjs

      - name: Python unit tests
        run: |
          dbus-run-session -- bash -ec '
            printf "ci-ephemeral-password" | gnome-keyring-daemon --unlock --components=secrets
            .venv/bin/python -m unittest discover -s tests -p "test_*.py" -v
            .venv/bin/python tests/subagent_pane_ui_smoke.py
            .venv/bin/python tests/subagent_queue_ui_smoke.py
            .venv/bin/python tests/characters_ui_smoke.py
            .venv/bin/python tests/provider_popup_ui_smoke.py
            .venv/bin/python tests/desktop_plugins_ui_smoke.py
            .venv/bin/python tests/desktop_pet_ui_smoke.py
            .venv/bin/python tests/subagent_collection_ui_smoke.py
            .venv/bin/python tests/subagent_reaction_ui_smoke.py
            .venv/bin/python tests/model_popup_ui_smoke.py
            .venv/bin/python tests/package_interaction_ui_smoke.py
            .venv/bin/python tests/preview_resize_ui_smoke.py
            .venv/bin/python tests/motion_ui_smoke.py
          '

  package:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            platform: windows-x64
          - name: Linux x64
            runner: ubuntu-22.04
            platform: linux-x64
          - name: macOS Apple Silicon
            runner: macos-15
            platform: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            platform: macos-x64
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11 extra-cmake-modules libgl1-mesa-dev libxkbcommon-dev libxcb1-dev libx11-dev libegl1 libopengl0 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 libxcb-render-util0 libxcb-randr0 libxcb-xfixes0 libnss3 libasound2

      - name: Set up Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./setup.ps1

      - name: Set up Unix
        if: runner.os != 'Windows'
        run: bash setup.sh

      - name: Node and Python unit tests
        shell: bash
        run: |
          verify_desktop() {
            set -e
            python_bin=.venv/bin/python
            if [ "$RUNNER_OS" = Windows ]; then python_bin=.venv/Scripts/python.exe; fi
            node --test tests/extension-metadata.test.mjs tests/update-engine.test.mjs tests/update-download.test.mjs tests/update-network.test.mjs tests/webview.test.mjs tests/pi-commands.test.mjs tests/pi-commands-integration.test.mjs tests/umeko-control.test.mjs tests/umeko-documents.test.mjs tests/widget-messages.test.mjs tests/subagents.test.mjs tests/subagent-ui.test.mjs tests/subagent-queue.test.mjs tests/rpc-ui.test.mjs tests/marketplace.test.mjs tests/marketplace-source.test.mjs tests/marketplace-audit-summary.test.mjs tests/marketplace-npm-resolution.test.mjs
            "$python_bin" -m unittest tests.test_update tests.test_common_providers tests.test_openai_responses tests.test_platform tests.test_desktop_notifications tests.test_umeko_control tests.test_characters tests.test_terminal_widget tests.test_widget_icon_rendering -q
          }
          export -f verify_desktop
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- bash -ec 'printf "ci-ephemeral-password" | gnome-keyring-daemon --unlock --components=secrets; verify_desktop'
          else
            verify_desktop
          fi

      - name: Windows regression suite
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/test-logs | Out-Null
          & '.venv/Scripts/python.exe' -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | Tee-Object -FilePath build/test-logs/regression.log
          if ($LASTEXITCODE -ne 0) { throw 'Regression suite failed' }
          & '.venv/Scripts/python.exe' tests/window_resize_ui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Window interaction regression failed' }

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1

      - name: Build Unix
        if: runner.os != 'Windows'
        run: bash build.sh

      - name: Windows native web preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & '.venv/Scripts/python.exe' tests/windows_webview_ui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows embedded browser failed' }

      - name: Verify packaged application and Pi
        run: python scripts/ci-smoke.py

      - name: macOS disk image build tools
        if: runner.os == 'macOS'
        run: |
          python -m pip install ds-store==1.3.1 mac-alias==2.2.3
          python -m unittest discover -s tests -p test_macos_dmg.py -v

      - name: Archive package
        run: python scripts/package-release.py --platform ${{ matrix.platform }}

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Umeko-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Provider development resources
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Umeko-provider-development
          path: build/provider-resources/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            build/ci-smoke/*.log
            build/ci-smoke/*.png
            build/ci-smoke/*.json
            build/Umeko/warn-Umeko.txt
            build/test-logs/*.log
            artifacts/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
