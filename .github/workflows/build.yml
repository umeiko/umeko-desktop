name: Desktop packages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'docs-site/**'
      - 'scripts/capture-documentation.py'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'docs-site/**'
      - 'scripts/capture-documentation.py'
  workflow_dispatch:
    inputs:
      all_platforms:
        description: Build all native platforms for a stable release
        type: boolean
        default: false

permissions:
  contents: read

env:
  # A stalled cache must leave time to install dependencies and run the checks.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Package scope
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.scope.outputs.packages }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Include both parents of the merge commit being tested.
          fetch-depth: 2
      - name: Check packaging inputs
        id: scope
        env:
          # main may advance after the event; compare this tested merge's base.
          PR_BASE: HEAD^1
          CI_ALL_PLATFORMS: ${{ inputs.all_platforms }}
        run: python3 scripts/ci-package-changes.py

  checks:
    name: checks
    runs-on: ubuntu-22.04
    # Include dependency setup, cache misses and post-job cleanup in the budget.
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xterm gnome-keyring dbus-x11 extra-cmake-modules libgl1-mesa-dev libxkbcommon-dev libxcb1-dev libx11-dev libegl1 libopengl0 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 libxcb-render-util0 libxcb-randr0 libxcb-xfixes0 libnss3 libasound2

      - name: Set up Linux
        run: bash setup.sh

      - name: Package optional CodeArts provider
        run: .venv/bin/python scripts/package-codearts-provider.py

      - name: Upload optional CodeArts provider
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Umeko-codearts-provider
          path: build/optional-providers/umeko-codearts-provider-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Node tests
        run: |
          node --test tests/system-prompt.test.mjs
          node --test runtime/test-plugin-session-permissions.mjs tests/auxiliary-vision.test.mjs tests/auxiliary-vision-bridge.test.mjs tests/video-generation.test.mjs tests/generation.test.mjs tests/markdown-preview.test.mjs tests/widget-catalog.test.mjs tests/session-capabilities.test.mjs tests/session-capabilities-integration.test.mjs tests/skills.test.mjs tests/tool-visibility.test.mjs tests/pet-reminder-local-time.test.mjs tests/conversation-search.test.mjs tests/background-jobs.test.mjs tests/tool-permissions.test.mjs tests/tool-permissions-integration.test.mjs tests/package-install.test.mjs tests/pi-widget-command.test.mjs tests/extension-metadata.test.mjs tests/update-engine.test.mjs tests/update-download.test.mjs tests/update-network.test.mjs tests/webview.test.mjs tests/pi-commands.test.mjs tests/pi-commands-integration.test.mjs tests/umeko-control.test.mjs tests/global-agents.test.mjs tests/umeko-documents.test.mjs tests/widget-messages.test.mjs tests/subagents.test.mjs tests/subagent-ui.test.mjs tests/subagent-queue.test.mjs tests/rpc-ui.test.mjs tests/compaction-bridge.test.mjs tests/recent-images.test.mjs tests/recent-images-bridge.test.mjs tests/pid-trajectory.test.mjs

      - name: Official ACP bridge tests
        run: node --test tests/dsh-acp.test.mjs tests/dsh-permissions.test.mjs tests/approval-view.test.mjs

      - name: Python unit tests
        run: |
          echo "Linux CPU cores: $(nproc)"
          .venv/bin/python -m pip install unittest-parallel==1.8.6
          unit_tests() {
            .venv/bin/python scripts/ci-unit-tests.py --jobs "$UNIT_TEST_JOBS"
          }
          export -f unit_tests
          isolated_tests() {
            # Each worker gets its own D-Bus/keyring; test profiles are temporary.
            dbus-run-session -- bash -ec '
              profile=$(mktemp -d "$RUNNER_TEMP/umeko-ci.XXXXXX")
              trap '\''rm -rf -- "$profile"'\'' EXIT
              export XDG_DATA_HOME="$profile/data" XDG_CONFIG_HOME="$profile/config" XDG_RUNTIME_DIR="$profile/run"
              mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR"
              chmod 700 "$XDG_RUNTIME_DIR"
              printf "ci-ephemeral-password" | gnome-keyring-daemon --unlock --components=secrets
              started=$SECONDS
              "$1"
              echo "$1 completed in $((SECONDS - started)) seconds"
            ' _ "$1"
          }
          cores=$(nproc)
          export UNIT_TEST_JOBS=$(((cores + 1) / 2))
          ui_jobs=$((cores / 2))
          if (( ui_jobs < 1 )); then ui_jobs=1; fi
          isolated_tests unit_tests &
          unit_pid=$!
          ui_status=0
          bash scripts/ci-ui-smokes.bash --jobs "$ui_jobs" || ui_status=$?
          unit_status=0
          wait "$unit_pid" || unit_status=$?
          if (( unit_status != 0 || ui_status != 0 )); then exit 1; fi

  windows-path-checks:
    name: Windows path regressions
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.packages != 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Set up Windows
        shell: pwsh
        run: ./setup.ps1
      - name: Verify long paths, native argv and running-tool layout
        shell: pwsh
        run: |
          & '.venv/Scripts/python.exe' scripts/ci-native-tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows path and tool-header regression failed' }
          & '.venv/Scripts/python.exe' tests/input_method_ui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Input-method caret regression failed' }

  package:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xterm gnome-keyring dbus-x11 extra-cmake-modules libgl1-mesa-dev libxkbcommon-dev libxcb1-dev libx11-dev libegl1 libopengl0 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 libxcb-render-util0 libxcb-randr0 libxcb-xfixes0 libnss3 libasound2

      - name: Set up Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./setup.ps1

      - name: Set up Unix
        if: runner.os != 'Windows'
        run: bash setup.sh

      - name: Native platform regressions
        shell: bash
        run: |
          verify_desktop() {
            set -e
            python_bin=.venv/bin/python
            if [ "$RUNNER_OS" = Windows ]; then python_bin=.venv/Scripts/python.exe; fi
            # Linux discovery already exercised this host's native unit tests.
            if [ "$RUNNER_OS" != Linux ]; then "$python_bin" scripts/ci-native-tests.py; fi
            "$python_bin" tests/input_method_ui_smoke.py
          }
          export -f verify_desktop
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- bash -ec 'printf "ci-ephemeral-password" | gnome-keyring-daemon --unlock --components=secrets; verify_desktop'
          else
            verify_desktop
          fi

      - name: Windows window interaction
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          & '.venv/Scripts/python.exe' tests/window_resize_ui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Window interaction regression failed' }

      - name: Windows IME caret positions
        if: runner.os == 'Windows'
        env:
          UMEKO_NATIVE_IME_TEST: '1'
        shell: bash
        run: .venv/Scripts/python.exe -m unittest tests.test_windows_ime_position -v

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1

      - name: Build Unix
        if: runner.os != 'Windows'
        run: bash build.sh

      - name: Windows native web preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & '.venv/Scripts/python.exe' tests/windows_webview_ui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows embedded browser failed' }

      - name: Verify packaged application and Pi
        run: python scripts/ci-smoke.py

      - name: macOS disk image build tools
        if: runner.os == 'macOS'
        run: |
          python -m pip install ds-store==1.3.1 mac-alias==2.2.3
          python -m unittest discover -s tests -p test_macos_dmg.py -v

      - name: Archive package
        run: python scripts/package-release.py --platform ${{ matrix.platform }}

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Umeko-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Provider development resources
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Umeko-provider-development
          path: build/provider-resources/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            build/ci-smoke/*.log
            build/ci-smoke/*.png
            build/ci-smoke/*.json
            build/Umeko/warn-Umeko.txt
            build/test-logs/*.log
            artifacts/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

  publish-preview:
    name: Replace rolling Windows Preview
    needs: [checks, package]
    if: >-
      ${{ !cancelled() && github.repository == 'umeiko/umeko-desktop'
          && github.ref == 'refs/heads/main'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && needs.checks.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    concurrency:
      group: rolling-preview-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Windows package and replace preview prerelease
        run: python3 scripts/ci_preview_release.py
