name: Preview desktop release
run-name: Preview ${{ inputs.source_ref }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag or commit to build (this repository)
        type: string
        required: true
        default: main
      windows_x64:
        description: Windows x64
        type: boolean
        default: true
      linux_x64:
        description: Linux x64
        type: boolean
        default: false
      macos_arm64:
        description: macOS Apple Silicon
        type: boolean
        default: false
      macos_x64:
        description: macOS Intel
        type: boolean
        default: false
      notes:
        description: Features or fixes included in this Preview
        type: string
        default: ''

permissions:
  contents: read

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  prepare:
    name: Select platforms and pin source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      platforms: ${{ steps.select.outputs.platforms }}
      commit: ${{ steps.select.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Preview publisher
        run: python3 -m unittest discover -s tests -p test_preview_release.py -v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
          path: source
      - id: select
        name: Resolve selected source once for every job
        env:
          PREVIEW_INPUTS: ${{ toJSON(inputs) }}
        run: python3 scripts/preview_release.py prepare

  checks:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ needs.prepare.outputs.commit }}
      checks_only: true

  package:
    needs: prepare
    name: Preview ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xterm gnome-keyring dbus-x11 extra-cmake-modules libgl1-mesa-dev libxkbcommon-dev libxcb1-dev libx11-dev libegl1 libopengl0 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 libxcb-render-util0 libxcb-randr0 libxcb-xfixes0 libnss3 libasound2

      - name: Set up Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./setup.ps1

      - name: Set up Unix
        if: runner.os != 'Windows'
        run: bash setup.sh

      - name: Native platform regressions
        shell: bash
        run: |
          verify_desktop() {
            set -e
            python_bin=.venv/bin/python
            if [ "$RUNNER_OS" = Windows ]; then python_bin=.venv/Scripts/python.exe; fi
            "$python_bin" scripts/ci-native-tests.py
            "$python_bin" tests/input_method_ui_smoke.py
          }
          export -f verify_desktop
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- bash -ec 'printf "ci-ephemeral-password" | gnome-keyring-daemon --unlock --components=secrets; verify_desktop'
          else
            verify_desktop
          fi

      - name: Windows window interaction
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          & '.venv/Scripts/python.exe' tests/window_resize_ui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Window interaction regression failed' }

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1

      - name: Build Unix
        if: runner.os != 'Windows'
        run: bash build.sh

      - name: Windows native web preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & '.venv/Scripts/python.exe' tests/windows_webview_ui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows embedded browser failed' }

      - name: Verify packaged application and Pi
        run: python scripts/ci-smoke.py

      - name: macOS disk image build tools
        if: runner.os == 'macOS'
        run: |
          python -m pip install ds-store==1.3.1 mac-alias==2.2.3
          python -m unittest discover -s tests -p test_macos_dmg.py -v

      - name: Archive package
        run: python scripts/package-release.py --platform ${{ matrix.platform }}

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Preview-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-diagnostics-${{ matrix.platform }}
          path: |
            build/ci-smoke/*.log
            build/ci-smoke/*.png
            build/ci-smoke/*.json
            build/Umeko/warn-Umeko.txt
            build/test-logs/*.log
            artifacts/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish verified Preview
    needs: [prepare, checks, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIEW_COMMIT: ${{ needs.prepare.outputs.commit }}
      PREVIEW_PLATFORMS: ${{ needs.prepare.outputs.platforms }}
      PREVIEW_NOTES: ${{ inputs.notes }}
    steps:
      # Run the publisher from the workflow revision, not the experimental source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify selected packages, upload and publish prerelease
        run: python3 scripts/preview_release.py publish
